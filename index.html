<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worst Sol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap">
<style>
:root{
  /* Layout: a field-manual sheet. Left-aligned on one wide column; the map opens the page,
     a dark caution-and-warning strip stays pinned, and every section below reacts to it. */
  --paper:#ECEEE9;      /* cool drafting paper */
  --sheet:#F8F9F5;      /* panels */
  --ink:#141A22;        /* blue-black ink */
  --ink-2:#4D5661;
  --ink-3:#737C86;
  --rule:#C6CAC1;
  --rule-soft:#DDE0D8;
  --plan:#2A78D6;       /* the blue of a Martian sunset: reach when all goes to plan */
  --go:#0CA30C; --caution:#FAB219; --serious:#EC835A; --nogo:#D03B3B;
  --lamp-amber:#FFB81F; --lamp-red:#F26257; --lamp-blue:#9CC8FF; --lamp-violet:#CDB1FF;
  --display:'Geologica','Segoe UI',system-ui,-apple-system,sans-serif;
  --data:'Martian Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
body.storm{ --paper:#E2D7C4; --sheet:#F1E9DA; --rule:#C8BAA1; --rule-soft:#D9CDB7; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{margin:0; background:var(--paper); color:var(--ink); font:400 16px/1.5 var(--display); transition:background-color .7s ease}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} body, .haze, .fill{transition:none !important} }
.wrap{max-width:1180px; margin-inline:auto; padding-inline:20px}
button, select, input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--plan); outline-offset:2px}
a{color:inherit; text-underline-offset:3px}
.num{font-family:var(--data); font-stretch:87.5%; font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* ---------- masthead ---------- */
.mast{display:flex; justify-content:space-between; align-items:center; gap:16px; padding-block:14px; border-bottom:2px solid var(--ink)}
.brand{display:flex; align-items:baseline; gap:6px 14px; flex-wrap:wrap}
.brand b{font-weight:800; font-size:20px; letter-spacing:-.015em}
.brand span{color:var(--ink-2); font-size:14px}
.lang{display:flex; border:1px solid var(--ink); border-radius:4px; overflow:hidden; flex:none}
.lang button{font:500 12px var(--data); padding:7px 11px; background:transparent; border:0; cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--sheet)}

/* ---------- opener ---------- */
.hero{padding-block:34px 30px}
.hero-top{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:20px 40px; align-items:end; margin-bottom:26px}
h1{font-weight:800; font-size:clamp(34px,5.4vw,66px); line-height:1.0; letter-spacing:-.03em; margin:0; text-wrap:balance}
.lead{font-size:18px; line-height:1.5; color:var(--ink-2); margin:0; max-width:50ch}
@media (max-width:860px){ .hero-top{grid-template-columns:1fr} }

.map-tools{display:flex; justify-content:space-between; align-items:center; gap:10px 24px; flex-wrap:wrap; margin-bottom:10px}
.seg{display:inline-flex; border:1px solid var(--ink); border-radius:4px; overflow:hidden; background:var(--sheet)}
.seg button{background:transparent; border:0; padding:7px 13px; font-size:14px; cursor:pointer; border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--sheet)}
.tool-label{font-size:14px; color:var(--ink-2); margin-right:8px}
.key{display:flex; gap:8px 20px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-2)}
.key span{display:inline-flex; align-items:center; gap:7px}
.glyph{width:12px; height:12px; flex:none; display:inline-block}
.glyph.ground{background:var(--ink); border-radius:50%; box-shadow:0 0 0 2px #fff}
.glyph.orbital{background:#fff; border:2.5px solid var(--ink); transform:rotate(45deg) scale(.82)}

.map-scroll{overflow-x:auto; border:1.5px solid var(--ink); background:#B4AE9F}
.map{position:relative; aspect-ratio:2/1; min-width:660px; overflow:hidden}
.map > canvas, .map > svg, .map > .tiles, .map > .haze{position:absolute; inset:0; width:100%; height:100%; display:block}
/* 8 x 4 tiles of Trek zoom level 2. The selector has to outrank the display:block set on the map's layers above. */
.map > .tiles{display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(4,1fr)}
.map > .tiles[hidden]{display:none}
.tiles img{width:100%; height:100%; min-width:0; min-height:0; display:block}
.haze{background:rgb(150 106 62 / 0); transition:background-color .8s ease; pointer-events:none}
.haze-note{position:absolute; left:12px; bottom:10px; font:500 12px var(--data); color:#fff; background:rgb(40 26 14 / .72); padding:4px 8px; border-radius:3px; pointer-events:none}
.map-foot{display:flex; justify-content:space-between; gap:8px 24px; flex-wrap:wrap; font-size:13px; color:var(--ink-2); margin-top:8px; line-height:1.4}
.map-foot p{margin:0; max-width:80ch}
.legend-bar{display:inline-flex; align-items:center; gap:8px; font-size:13px}
.legend-bar i{display:inline-block; width:120px; height:10px; border:1px solid var(--ink-3)}
.legend-sw{display:inline-flex; align-items:center; gap:7px; margin-right:16px}
.legend-sw i{display:inline-block; width:22px; height:12px; border:1px solid var(--ink-3)}

.grat{stroke:rgb(20 26 34 / .22); stroke-width:.7; fill:none}
.grat-eq{stroke:rgb(20 26 34 / .4)}
.grat-t{font:500 10.5px var(--data); fill:rgb(20 26 34 / .7); paint-order:stroke; stroke:rgb(255 255 255 / .6); stroke-width:2.5px}
.mk{cursor:pointer; outline:none}
.mk .hit{fill:transparent}
.mk .dot{fill:var(--ink); stroke:#fff; stroke-width:2}
.mk.orbital .dot{fill:#fff; stroke:var(--ink); stroke-width:2.5}
.mk .ring{fill:none; stroke:var(--ink); stroke-width:1.6; opacity:0}
.mk.sel .ring{opacity:1}
.mk:hover .ring{opacity:.55}
.mk:focus-visible .ring{opacity:1; stroke:var(--plan); stroke-width:3}
.mk text{font:650 13.5px var(--display); fill:var(--ink); paint-order:stroke; stroke:rgb(255 255 255 / .86); stroke-width:3.6px; stroke-linejoin:round}
.mk.mine text{text-decoration:underline}
.sun-t{font:500 10.5px var(--data); fill:#fff; paint-order:stroke; stroke:rgb(10 14 24 / .75); stroke-width:3px}
@media (max-width:760px){ .mk text{display:none} }

.vote-row{display:flex; gap:10px 20px; align-items:center; flex-wrap:wrap; margin-top:18px}
.vote-row strong{font-weight:650; font-size:17px}
.linkbtn{background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; color:var(--ink-2); font-size:14.5px}
.chips{display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:8px; margin-top:12px}
.chip{display:grid; grid-template-columns:14px 1fr; gap:3px 10px; align-items:start; align-content:start; text-align:left; padding:11px 12px; background:var(--sheet); border:1px solid var(--rule); border-radius:6px; cursor:pointer}
.chip .glyph{margin-top:6px}
.chip b{font-weight:650; font-size:15.5px; line-height:1.3}
.chip span.tz{grid-column:2; font-size:13.5px; color:var(--ink-2); line-height:1.35}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.tag{display:inline-block; font:500 10.5px var(--data); padding:2px 6px; border-radius:3px; background:var(--ink); color:var(--sheet); margin-left:6px; vertical-align:2px; white-space:nowrap}
.reveal{margin-top:14px; padding:16px 20px; background:var(--ink); color:#F1F3EE; border-radius:6px; display:flex; gap:14px 28px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.reveal p{margin:0; font-size:18px; line-height:1.4; max-width:62ch}
.reveal p b{font-weight:700}
.btn{display:inline-block; background:var(--sheet); color:var(--ink); border:1px solid var(--ink); border-radius:4px; padding:9px 14px; font-weight:600; font-size:14.5px; text-decoration:none; cursor:pointer}
.btn.ghost{background:transparent}
.reveal .btn{border-color:#F1F3EE}

/* ---------- caution-and-warning strip ---------- */
.console{position:sticky; top:0; z-index:20; background:var(--ink); color:#E6EAE4}
.console-in{display:flex; gap:12px 20px; align-items:flex-start; flex-wrap:wrap; padding-block:11px}
.con-block{display:flex; flex-direction:column; gap:5px}
.con-label{font:500 11px var(--data); color:#98A2AC}
.con-site{flex:0 1 210px; min-width:170px}
.console select{background:#1D242D; color:#E6EAE4; border:1px solid #3A434E; border-radius:4px; padding:7px 8px; font-size:14px; max-width:100%}
.lamps{display:flex; gap:8px; flex-wrap:wrap; flex:3 1 520px}
.lamp-wrap{display:flex; flex-direction:column; gap:5px; flex:1 1 138px; min-width:132px}
.lamp{appearance:none; text-align:left; border:1px solid #3A434E; background:#1D242D; color:#98A2AC; border-radius:4px; padding:7px 10px 8px; cursor:pointer; display:flex; flex-direction:column; gap:0; min-height:50px; position:relative}
.lamp{flex:1}
.lamp b{font-weight:700; font-size:14px; padding-right:12px; color:#DCE1E6; line-height:1.25}
.lamp span{font-size:12px; line-height:1.3}
.lamp::after{content:''; position:absolute; right:9px; top:9px; width:8px; height:8px; border-radius:50%; background:#3A434E}
.lamp:hover{border-color:#6A7480}
.lamp[aria-pressed="true"], .lamp[aria-pressed="true"] b{color:#191204}
.lamp[aria-pressed="true"]::after{background:#191204}
.lamp-amber[aria-pressed="true"]{background:var(--lamp-amber); border-color:var(--lamp-amber)}
.lamp-red[aria-pressed="true"]{background:var(--lamp-red); border-color:var(--lamp-red)}
.lamp-blue[aria-pressed="true"]{background:var(--lamp-blue); border-color:var(--lamp-blue)}
.lamp-violet[aria-pressed="true"]{background:var(--lamp-violet); border-color:var(--lamp-violet)}
.lamp-sub{display:flex; gap:6px; align-items:center; min-height:28px; font-size:12px; color:#98A2AC}
.lamp-sub select{padding:4px 6px; font-size:12.5px; width:100%}
.lamp-sub input[type=range]{flex:1; min-width:60px; accent-color:var(--lamp-blue)}
.lamp-sub button, .con-season button{background:#1D242D; color:#DCE1E6; border:1px solid #3A434E; border-radius:4px; padding:4px 8px; font-size:12.5px; cursor:pointer; white-space:nowrap}
.lamp-sub button:hover, .con-season button:hover{border-color:#6A7480}
.con-season{flex:1 1 230px; min-width:210px}
.con-season .row{display:flex; gap:8px; align-items:center}
.con-season input[type=range]{flex:1; min-width:80px; accent-color:#DCE1E6}
.con-season output{font:500 12px var(--data); color:#DCE1E6; display:block; min-height:18px}
@media (max-width:900px){ .console{position:static} }

/* ---------- sections ---------- */
.sec{padding-block:44px 40px; border-top:1px solid var(--rule); scroll-margin-top:140px}
.sec:first-of-type{border-top:0}
.sec-head{display:flex; gap:14px; align-items:flex-start; margin-bottom:22px}
.sec-num{font:600 14px var(--data); border:1.5px solid var(--ink); border-radius:50%; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; flex:none; margin-top:3px}
h2{font-weight:750; font-size:clamp(25px,3.1vw,36px); letter-spacing:-.022em; line-height:1.1; margin:0; text-wrap:balance}
h3{font-weight:700; font-size:18px; letter-spacing:-.01em; line-height:1.25; margin:0 0 8px}
.sec-sub{margin:7px 0 0; color:var(--ink-2); max-width:72ch}
.cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px}
.cols.wide-left{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
@media (max-width:900px){ .cols, .cols.wide-left{grid-template-columns:1fr} }
.panel{background:var(--sheet); border:1px solid var(--rule); border-radius:8px; padding:18px 20px}
.stack{display:flex; flex-direction:column; gap:16px}
.muted{color:var(--ink-2)}
.small{font-size:13.5px; line-height:1.45}

.facts{width:100%; border-collapse:collapse}
.facts th{font-weight:450; color:var(--ink-2); text-align:left; padding:9px 14px 9px 0; vertical-align:top; width:36%; font-size:14.5px}
.facts td{padding:9px 0; vertical-align:top}
.facts tr + tr th, .facts tr + tr td{border-top:1px solid var(--rule-soft)}
.facts .v{font-weight:600}
.src{display:block; font:400 11.5px/1.4 var(--data); font-stretch:87.5%; color:var(--ink-3); margin-top:3px}
.changed{background:linear-gradient(transparent 55%, rgb(250 178 25 / .45) 55%)}

.lesson{border-left:4px solid var(--ink); padding:2px 0 2px 16px}
.lesson p{margin:0; max-width:60ch}
.scorehead{display:flex; align-items:baseline; gap:8px 18px; flex-wrap:wrap; margin-bottom:12px}
.scorehead .big{font:600 34px/1 var(--data); font-stretch:87.5%; letter-spacing:-.02em}
.bars{display:grid; gap:9px}
.bar{display:grid; grid-template-columns:minmax(120px,170px) 1fr 40px; gap:10px; align-items:center; font-size:14.5px}
.track{height:10px; background:var(--rule-soft); border-radius:0 4px 4px 0}
.fill{height:100%; background:var(--ink-2); border-radius:0 4px 4px 0; min-width:2px; transition:width .4s ease}
.bar.weak .fill{background:var(--nogo)}
.bar .val{text-align:right; font:500 13px var(--data)}
.links{display:flex; gap:8px 18px; flex-wrap:wrap; font-size:14.5px}

/* ---------- Marswalk ---------- */
.walkmap{width:100%; height:auto; display:block; max-width:620px; margin-inline:auto}
.wl-tools{display:flex; align-items:center; gap:4px 8px; margin-bottom:12px; flex-wrap:wrap}
.walkbox{position:relative; max-width:620px; margin-inline:auto; aspect-ratio:1; border:1.5px solid var(--ink); overflow:hidden; background:#E9E2D0}
.walkbox canvas, .walkbox svg{position:absolute; inset:0; width:100%; height:100%; display:block; max-width:none; margin:0}
.w-scale rect{fill:rgb(248 249 245 / .88)}
.w-scale path{fill:none; stroke:var(--ink); stroke-width:1.6}
.w-scale text, .w-north text{font:600 11px var(--data); fill:var(--ink)}
.w-north path{fill:var(--ink); stroke:var(--sheet); stroke-width:1.5; stroke-linejoin:round}
.w-north text{paint-order:stroke; stroke:var(--sheet); stroke-width:3px}
.w-route-case{fill:none; stroke:var(--sheet); stroke-width:6.5; stroke-linecap:round; stroke-linejoin:round}
.w-route{fill:none; stroke:var(--ink); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
@media (max-width:600px){ .walkmap .w-t{font-size:19px; stroke-width:5px} .walkmap .w-t.small{font-size:17px} .w-scale text, .w-north text{font-size:16px} }
.terr-key{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--ink-2); margin-top:12px}
.terr-key span{display:inline-flex; align-items:center; gap:7px}
.terr-key i{width:16px; height:12px; border:1px solid var(--ink-3); flex:none}
.terr-key .legend-bar i{width:120px; height:10px}
.w-ring{fill:none; stroke:rgb(20 26 34 / .2); stroke-width:1}
.w-ringt{font:500 10.5px var(--data); fill:var(--ink-3)}
.w-plan{fill:rgb(250 178 25 / .13); stroke:var(--plan); stroke-width:2; stroke-dasharray:7 5}
.w-safe{fill:rgb(12 163 12 / .14); stroke:var(--go); stroke-width:2.2}
.w-base{fill:var(--ink); stroke:var(--sheet); stroke-width:2}
.w-t{font:600 12.5px var(--display); fill:var(--ink); paint-order:stroke; stroke:var(--sheet); stroke-width:3.5px; stroke-linejoin:round}
.w-t.small{font-weight:450; fill:var(--ink-2)}
.w-tg{cursor:pointer; outline:none}
.w-tg .halo{fill:none; stroke:var(--ink); stroke-width:1.6; opacity:0}
.w-tg.sel .halo{opacity:1}
.w-tg:focus-visible .halo{opacity:1; stroke:var(--plan); stroke-width:3}
.w-path{stroke:var(--ink); stroke-width:1.4; stroke-dasharray:2 4; fill:none}
.w-ghost{fill:none; stroke:var(--ink-2); stroke-width:1.5}
.w-leg{font:450 12px var(--display); fill:var(--ink-2)}
.walk-key{display:grid; gap:6px; font-size:13.5px; color:var(--ink-2); margin-top:10px}
.walk-key span{display:flex; gap:9px; align-items:flex-start}
.walk-key i{flex:none; width:24px; height:0; margin-top:9px; border-top:2px solid var(--go)}
.walk-key i.plan{border-top:2px dashed var(--plan)}

.vd{display:inline-flex; align-items:center; gap:6px; font-weight:650; font-size:12.5px; padding:3px 9px 3px 7px; border-radius:999px; border:1px solid var(--rule); background:#fff; white-space:nowrap; color:var(--ink)}
.vd i{width:10px; height:10px; flex:none}
.vd.go i{background:var(--go); border-radius:50%}
.vd.risk i{background:var(--caution); clip-path:polygon(50% 0,100% 100%,0 100%); outline:0}
.vd.nogo i{background:var(--nogo); clip-path:polygon(20% 0,50% 30%,80% 0,100% 20%,70% 50%,100% 80%,80% 100%,50% 70%,20% 100%,0 80%,30% 50%,0 20%)}
.tgs{display:grid; gap:7px}
.tg{display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center; padding:9px 12px; border:1px solid var(--rule); border-radius:6px; background:var(--sheet); cursor:pointer; text-align:left; width:100%}
.tg b{font-weight:650; font-size:15px}
.tg small{grid-column:1; color:var(--ink-2); font-size:13px}
.tg .vd{grid-row:1 / span 2; grid-column:2}
.tg:hover{border-color:var(--ink-3)}
.tg[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.detail h3{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.tl{position:relative; height:26px; margin:26px 0 30px}
.tl-track{position:absolute; inset:0; background:var(--rule-soft); border-radius:3px}
.tl-seg{position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center; font:500 11px var(--data); color:#fff; overflow:hidden; white-space:nowrap; box-shadow:inset -2px 0 0 var(--sheet)}
.tl-seg.out, .tl-seg.back{background:var(--plan)}
.tl-seg.work{background:var(--ink)}
.tl-seg.storm{background:repeating-linear-gradient(135deg,var(--plan) 0 6px,#6A9FE0 6px 10px)}
.tl-tick{position:absolute; top:-6px; bottom:-6px; width:0; border-left:2px solid var(--ink)}
.tl-tick.res{border-left-style:dashed; border-left-color:var(--nogo)}
.tl-tick span{position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap; font:500 10.5px var(--data); color:var(--ink-2)}
.tl-tick .up{bottom:100%; margin-bottom:2px}
.tl-tick .dn{top:100%; margin-top:2px}
.tl-tick.far span{left:auto; right:4px; transform:none}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:14.5px; margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0; font-weight:600}
.verdict-line{margin:12px 0 0; padding:10px 12px; border-radius:6px; background:#fff; border:1px solid var(--rule); font-size:15px}
.science{margin-top:14px; padding-top:12px; border-top:1px solid var(--rule-soft)}
.science p{margin:0}
.pre{display:grid; gap:10px}
.pre article{padding:12px 14px; border-radius:6px; border:1px solid var(--rule); background:var(--sheet); border-left-width:5px}
.pre article.amber{border-left-color:var(--lamp-amber)}
.pre article.red{border-left-color:var(--lamp-red)}
.pre article.blue{border-left-color:#5FA3EE}
.pre article.violet{border-left-color:#A77BEA}
.pre h3{font-size:15.5px; margin-bottom:4px}
.pre p{margin:0; font-size:14.5px; line-height:1.45}

/* ---------- one sol ---------- */
.sol-ctrl{display:flex; gap:12px 16px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
.sol-ctrl input[type=range]{flex:1 1 240px; accent-color:var(--ink)}
.readout{display:flex; gap:6px 8px; flex-wrap:wrap; margin-bottom:10px}
.readout span{font:500 12.5px var(--data); font-stretch:87.5%; background:var(--sheet); border:1px solid var(--rule); border-radius:4px; padding:5px 9px; white-space:nowrap}
.readout span b{font-weight:600}
.logline{font-size:17px; line-height:1.45; margin:0 0 14px; max-width:78ch; min-height:3em}
.chart-scroll{overflow-x:auto}
.solchart{display:block; width:100%; min-width:760px; height:auto}
.c-title{font:650 12.5px var(--display); fill:var(--ink)}
.c-axis{font:450 10.5px var(--data); fill:var(--ink-3)}
.c-grid{stroke:var(--rule-soft); stroke-width:1}
.c-base{stroke:var(--rule); stroke-width:1}
.c-line{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.c-lab{font:500 11.5px var(--display); fill:var(--ink-2)}
.c-play{stroke:var(--ink); stroke-width:1.2}
.c-dot{stroke:var(--sheet); stroke-width:2}
.crew-t{font:500 11px var(--display)}
.proj{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:20px; align-items:center; margin-top:18px}
@media (max-width:900px){ .proj{grid-template-columns:1fr} }
.proj p{margin:0; font-size:17px; line-height:1.45}
.projchart{display:block; width:100%; height:auto}

/* ---------- crowd ---------- */
.locked{padding:26px 22px; text-align:left}
.locked p{margin:0 0 12px; font-size:18px; max-width:56ch}
.table-scroll{overflow-x:auto}
.rank{width:100%; border-collapse:collapse; min-width:720px}
.rank th{font-weight:500; font-size:12.5px; color:var(--ink-2); text-align:left; padding:8px 10px; border-bottom:1.5px solid var(--ink); white-space:nowrap}
.rank td{padding:9px 10px; border-bottom:1px solid var(--rule-soft); vertical-align:middle; font-size:14.5px}
.rank tr.rowbtn{cursor:pointer}
.rank tr.rowbtn:hover td{background:rgb(255 255 255 / .6)}
.rank tr.cur td{background:#fff}
.rank .n{font:500 13px var(--data); color:var(--ink-2); width:34px}
.rank .site b{font-weight:650}
.rank .site small{display:block; color:var(--ink-2); font-size:12.5px}
.hbar{display:grid; grid-template-columns:1fr 34px; gap:8px; align-items:center; min-width:150px}
.hbar .track{height:9px}
.hbar .fill.votes{background:var(--plan)}
.hbar span{font:500 12.5px var(--data); text-align:right}
.delta{font:500 12.5px var(--data); white-space:nowrap}
.crowd-sum{font-size:19px; line-height:1.4; margin:0 0 16px; max-width:70ch}
.crowd-actions{display:flex; gap:10px 14px; flex-wrap:wrap; align-items:center; margin-top:16px}

/* ---------- method ---------- */
.three{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
@media (max-width:900px){ .three{grid-template-columns:1fr} }
.three p{margin:0; font-size:14.5px; line-height:1.5}
.assume{columns:2; column-gap:32px; padding-left:18px; margin:0; font-size:14.5px}
.assume li{break-inside:avoid; margin-bottom:5px}
@media (max-width:700px){ .assume{columns:1} }
.srclist{padding-left:18px; margin:0; font-size:14.5px}
.srclist li{margin-bottom:5px}
footer{border-top:2px solid var(--ink); padding-block:18px 40px; font-size:13.5px; color:var(--ink-2)}
footer p{margin:0; max-width:90ch}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand"><b data-i18n="brand"></b><span data-i18n="brand_sub"></span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langRu" aria-pressed="false">RU</button>
      <button type="button" id="langEn" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
  <section class="hero" id="choose">
    <div class="hero-top">
      <h1 data-i18n="h1"></h1>
      <p class="lead" data-i18n="lead"></p>
    </div>

    <div class="map-tools">
      <div>
        <span class="tool-label" data-i18n="layers"></span>
        <span class="seg" role="group" id="layerSeg">
          <button type="button" data-layer="relief" aria-pressed="true" data-i18n="layer_relief"></button>
          <button type="button" data-layer="sun" aria-pressed="false" data-i18n="layer_sun"></button>
          <button type="button" data-layer="ice" aria-pressed="false" data-i18n="layer_ice"></button>
        </span>
        <span class="seg" role="group" id="baseSeg" hidden style="margin-left:8px">
          <button type="button" data-base="mola" aria-pressed="true">MOLA</button>
          <button type="button" data-base="viking" aria-pressed="false">Viking</button>
        </span>
      </div>
      <div class="key">
        <span><i class="glyph ground"></i><span data-i18n="legend_ground"></span></span>
        <span><i class="glyph orbital"></i><span data-i18n="legend_orbital"></span></span>
      </div>
    </div>
    <div class="map-scroll">
      <div class="map" id="map">
        <canvas id="relief" width="1280" height="640" aria-hidden="true"></canvas>
        <div class="tiles" id="tiles" hidden aria-hidden="true"></div>
        <canvas id="overlay" width="720" height="360" aria-hidden="true"></canvas>
        <div class="haze" id="haze"></div>
        <svg id="mapsvg" viewBox="0 0 1000 500" preserveAspectRatio="none" role="group" aria-label="Mars"></svg>
        <div class="haze-note" id="hazeNote" hidden></div>
      </div>
    </div>
    <div class="map-foot">
      <p id="mapNote"></p>
      <div id="layerLegend"></div>
    </div>

    <div class="reveal" id="reveal" hidden></div>
    <div class="vote-row" id="voteRow"></div>
    <div class="chips" id="chips"></div>
  </section>
  </main>
</div>

<div class="console" id="console">
  <div class="wrap console-in">
    <div class="con-block con-site">
      <label class="con-label" for="siteSelect" data-i18n="con_site"></label>
      <select id="siteSelect"></select>
    </div>
    <div class="lamps">
      <div class="lamp-wrap">
        <button type="button" class="lamp lamp-amber" id="lampStorm" aria-pressed="false"><b data-i18n="st_storm"></b><span id="lampStormSub"></span></button>
        <div class="lamp-sub"><select id="stormClass" aria-label="Storm"></select></div>
      </div>
      <div class="lamp-wrap">
        <button type="button" class="lamp lamp-violet" id="lampFlare" aria-pressed="false"><b data-i18n="st_flare"></b><span id="lampFlareSub"></span></button>
        <div class="lamp-sub"><span id="flareNote"></span></div>
      </div>
      <div class="lamp-wrap">
        <button type="button" class="lamp lamp-red" id="lampReactor" aria-pressed="false"><b data-i18n="st_reactor"></b><span data-i18n="st_reactor_sub"></span></button>
        <div class="lamp-sub"><span id="reactorNote"></span></div>
      </div>
      <div class="lamp-wrap">
        <button type="button" class="lamp lamp-blue" id="lampOffset" aria-pressed="false"><b data-i18n="st_offset"></b><span id="lampOffsetSub"></span></button>
        <div class="lamp-sub"><input type="range" id="offsetKm" min="1" max="10" step="1" value="3" aria-label="km"><button type="button" id="offsetDir" data-i18n="st_offset_dir"></button></div>
      </div>
    </div>
    <div class="con-block con-season">
      <label class="con-label" for="ls" data-i18n="season"></label>
      <div class="row"><input type="range" id="ls" min="0" max="359" step="1" value="190"><button type="button" id="worstSeason" data-i18n="btn_worst_season"></button></div>
      <output id="lsOut" for="ls"></output>
    </div>
  </div>
</div>

<div class="wrap">
  <section class="sec" id="site">
    <div class="sec-head"><span class="sec-num">1</span><div><h2 id="siteTitle"></h2><p class="sec-sub" id="siteSub"></p></div></div>
    <div class="cols wide-left">
      <div class="panel"><table class="facts" id="facts"></table></div>
      <div class="stack">
        <div class="panel" id="scorePanel"></div>
        <div class="panel"><div class="lesson" id="lesson"></div></div>
        <div class="links" id="siteLinks"></div>
      </div>
    </div>
  </section>

  <section class="sec" id="walk">
    <div class="sec-head"><span class="sec-num">2</span><div><h2 data-i18n="s2"></h2><p class="sec-sub" id="walkSub"></p></div></div>
    <div class="cols">
      <div class="panel">
        <div class="wl-tools">
          <span class="tool-label" data-i18n="layers"></span>
          <span class="seg" role="group" id="wlSeg">
            <button type="button" data-wl="ground" aria-pressed="true" data-i18n="wl_ground"></button>
            <button type="button" data-wl="time" aria-pressed="false" data-i18n="wl_time"></button>
          </span>
        </div>
        <div class="walkbox">
          <canvas id="walkcv" width="480" height="480" aria-hidden="true"></canvas>
          <svg class="walkmap" id="walkmap" viewBox="0 0 560 560" role="group"></svg>
        </div>
        <div class="terr-key" id="terrKey"></div>
        <div class="walk-key" id="walkKey"></div>
        <p class="small muted" id="wmapNote" style="margin:10px 0 0"></p>
      </div>
      <div class="stack">
        <div class="pre" id="precedents"></div>
        <div class="tgs" id="targets"></div>
        <div class="panel detail" id="detail"></div>
      </div>
    </div>
  </section>

  <section class="sec" id="sol">
    <div class="sec-head"><span class="sec-num">3</span><div><h2 data-i18n="s3"></h2><p class="sec-sub" id="solSub"></p></div></div>
    <div class="sol-ctrl">
      <button type="button" class="btn" id="play"></button>
      <input type="range" id="scrub" min="0" max="24" step="0.05" value="13" aria-label="LTST">
    </div>
    <div class="readout" id="readout"></div>
    <p class="logline" id="logline"></p>
    <div class="panel"><div class="chart-scroll"><svg class="solchart" id="solchart" viewBox="0 0 1000 512" role="img"></svg></div></div>
    <div class="proj">
      <div class="panel"><svg class="projchart" id="projchart" viewBox="0 0 640 186" role="img"></svg></div>
      <div><h3 data-i18n="proj_title"></h3><p id="projText"></p></div>
    </div>
  </section>

  <section class="sec" id="crowd">
    <div class="sec-head"><span class="sec-num">4</span><div><h2 data-i18n="s4"></h2><p class="sec-sub" data-i18n="s4_sub"></p></div></div>
    <div id="crowdBody"></div>
  </section>

  <section class="sec" id="method">
    <div class="sec-head"><span class="sec-num">5</span><div><h2 data-i18n="s5"></h2><p class="sec-sub" data-i18n="s5_sub"></p></div></div>
    <div class="stack">
      <div class="three">
        <div class="panel"><h3 data-i18n="m_measured_t"></h3><p data-i18n="m_measured"></p></div>
        <div class="panel"><h3 data-i18n="m_computed_t"></h3><p data-i18n="m_computed"></p></div>
        <div class="panel"><h3 data-i18n="m_schematic_t"></h3><p data-i18n="m_schematic"></p></div>
      </div>
      <div class="panel"><h3 data-i18n="m_assume_t"></h3><ul class="assume" id="assume"></ul></div>
      <div class="panel"><h3 data-i18n="m_sources_t"></h3><ul class="srclist" id="sources"></ul></div>
    </div>
  </section>

  <footer><p data-i18n="footer"></p></footer>
</div>

  const s = site(), c = cond(), tau = M.tauOf(c), r = rankOf(s.id), st = M.sunTimes(s.lat, S.ls);
  $('#siteTitle').textContent = L(s.name);
  $('#siteSub').textContent = L(s.mission);
  const tr = M.tempRange(s, S.ls, tau), ex = M.extremeLs(s.lat);
  const p = M.pressure(s.elev);
  const land = s.hazard < 0.2 ? 'land_flat' : s.hazard < 0.4 ? 'land_rocks' : s.hazard < 0.6 ? 'land_rough' : 'land_bad';
  const day = st.polarNight ? t('polar_night') : st.polarDay ? t('polar_day') : hm(st.len * M.MARS.solH / 24);
  const hot = S.storm ? ' class="changed"' : '';
  const row = (k, v, src) => `<tr><th scope="row">${t(k)}</th><td><span class="v">${v}</span><span class="src">${src}</span></td></tr>`;
  $('#facts').innerHTML =
    row('p_coords', `${nf(Math.abs(s.lat), 2)}° ${s.lat >= 0 ? t('u_N') : t('u_S')}, ${nf((s.lon + 360) % 360, 2)}° ${t('u_E')}`, t('src_mola')) +
    row('p_elev', `${nf(s.elev, 1)} ${t('u_km')}`, t('src_mola')) +
    row('p_press', t('press_v', { p: nf(p / 100, 1), pct: nf(p / 101325 * 100, 2) }), t('src_press')) +
    row('p_temp', `<span${hot}>${t('temp_v', { a: nf(Math.round(tr.tmin)), b: nf(Math.round(tr.tmax)) })}</span>`, (s.tsrc ? L(s.tsrc) : t('src_est')) + ', ' + t('src_season')) +
    row('p_day', day, t('src_orbit')) +
    row('p_sun', `<span${hot}>${t('sun_v', { now: nf(M.dailyKWh(s.lat, S.ls, tau), 2), min: nf(M.dailyKWh(s.lat, ex.worst, M.MARS.tauClear), 2) })}</span>`, t('src_orbit')) +
    row('p_water', esc(L(s.water)), L(s.wsrc)) +
    row('p_rad', t('rad_v', { v: nf(M.radiation(s.elev), 2) }) + (S.flare ? ` <span class="changed">${t('rad_flare')}</span>` : ''), t('src_rad') + (S.flare ? '; ' + t('src_flare') : '')) +
    row('p_land', `${t(land)}; ${t(s.elev > 0.5 ? 'land_thin' : 'land_air')}`, t('src_mola') + (s.kind === 'orbital' ? '; ' + t('src_est') : ''));

  const names = { water: 'c_water', power: 'c_power', walk: 'c_walk', land: 'c_land' };
  const bars = ['water', 'power', 'walk', 'land'].filter(k => r.comps[k] !== undefined).map(k =>
    `<div class="bar${k === r.weak ? ' weak' : ''}"><span>${t(names[k])}${k === r.weak ? `<span class="tag">${t('weak_tag')}</span>` : ''}</span>` +
    `<div class="track"><div class="fill" style="width:${Math.max(1, r.comps[k]).toFixed(0)}%"></div></div><span class="val">${nf(r.comps[k])}</span></div>`).join('');
  const hold = Number.isFinite(r.hold) ? t('hold_n', { n: Math.floor(r.hold), sols: plural(Math.floor(r.hold), SOLS) }) : t('hold_inf');
  $('#scorePanel').innerHTML =
    `<h3>${t('score_title')}</h3><div class="scorehead"><span class="big">${nf(r.worst)}</span><span class="muted">${t('score_of', { rank: r.rankWorst, n: SITES.length })}</span></div>` +
    `<div class="bars">${bars}</div><p class="small muted" style="margin:12px 0 0">${hold}${r.comps.walk === undefined ? ' ' + t('no_walk_score') : ''} ${t('score_naive', { v: nf(r.naive) })}.</p>`;
  $('#lesson').innerHTML = `<h3>${esc(L(s.lesson.t))}</h3><p>${esc(L(s.lesson.x))}</p>`;
  const trek = `https://trek.nasa.gov/mars/#v=0.1&x=${s.lon}&y=${s.lat}&z=6&p=urn%3Aogc%3Adef%3Acrs%3AEPSG%3A%3A104905&d=`;
  $('#siteLinks').innerHTML = `<a href="${trek}" target="_blank" rel="noopener">${t('link_trek')}</a>` +
    `<a href="https://astrogeology-usgs.hub.arcgis.com/pages/interactive-maps-mars" target="_blank" rel="noopener">${t('link_usgs')}</a>` +
    (s.extraLink ? `<a href="${s.extraLink.url}" target="_blank" rel="noopener">${esc(L(s.extraLink.t))}</a>` : '');
}

/* ================= 2. MARSWALK ================= */
const WP = 560;
const TCOL = { plain: [233, 226, 208], rocky: [206, 194, 173], sand: [229, 194, 124], slope: [181, 146, 112], cliff: [88, 78, 72] };
const TIME_RAMP = [[0, [46, 150, 72]], [1, [244, 204, 72]], [2, [216, 84, 60]], [3.2, [112, 58, 58]]];
const mix3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
const rampAt = (stops, v) => {
  if (v <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) return mix3(stops[i - 1][1], stops[i][1], (v - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]));
  return stops[stops.length - 1][1];
};
/* Two passes of corner cutting turn a staircase of grid cells into a line a person could walk. */
const smoothPath = pts => {
  let p = pts;
  for (let k = 0; k < 2 && p.length > 3; k++) {
    const q = [p[0]];
    for (let i = 0; i < p.length - 1; i++) { const a = p[i], b = p[i + 1]; q.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); }
    q.push(p[p.length - 1]); p = q;
  }
  return p;
};
/* The ground, and on top of it where one failure is still survivable (green line) and where the air lasts on plan (blue line). */
function drawWalkRaster(s, c, F) {
  const cv = $('#walkcv'), P = cv.width, ctx = cv.getContext('2d'), img = ctx.createImageData(P, P), px = img.data;
  const W = F.W, E = M.EVA, sf = c.storm ? E.stormFactor : 1, lim = M.limitH(c), rover = !c.reactor, step = 2 * W / P;
  if (!F.raster) {
    F.raster = new Uint8Array(P * P);
    for (let j = 0; j < P; j++) for (let i = 0; i < P; i++) F.raster[j * P + i] = M.CLASSES.indexOf(M.classAt(s, -W + (i + .5) * step, W - (j + .5) * step));
  }
  const zone = new Uint8Array(P * P), time = S.wlayer === 'time';
  for (let j = 0; j < P; j++) {
    const y = W - (j + .5) * step;
    for (let i = 0; i < P; i++) {
      const o = j * P + i, x = -W + (i + .5) * step, k = M.CLASSES[F.raster[o]];
      const tw = M.sample(F, F.walk.time, x, y), tr = rover ? M.sample(F, F.rov.time, x, y) : M.BIG;
      const tSafe = Math.min(tw / (E.hurry * sf), E.dispatchH + tr / sf);
      const z = tSafe <= lim ? 2 : tw * (1 + 1 / sf) + E.workH <= E.suitH ? 1 : 0;
      zone[o] = z;
      let col = TCOL[k], sh = 1;
      if (k === 'rocky') { if ((((i * 73856093) ^ (j * 19349663)) & 15) === 0) sh = .84; }
      else if (k === 'sand') sh = 1 + .07 * Math.sin(i * .55 + j * .9);
      else if (k === 'slope') { if ((i + j) % 7 === 0) sh = .86; }
      else if (k === 'cliff') { if ((i - j + 4096) % 5 === 0) sh = .8; }
      if (time) col = tSafe > 1e6 ? mix3(col, [84, 84, 88], .7) : mix3(col, rampAt(TIME_RAMP, tSafe / lim), .78);
      else if (z === 2) col = mix3(col, [60, 170, 70], .2);
      else if (z === 0) col = mix3(col, [132, 134, 136], .42);
      px[o * 4] = col[0] * sh; px[o * 4 + 1] = col[1] * sh; px[o * 4 + 2] = col[2] * sh; px[o * 4 + 3] = 255;
    }
  }
  const paint = (o, c3) => { px[o * 4] = c3[0]; px[o * 4 + 1] = c3[1]; px[o * 4 + 2] = c3[2]; };
  for (let j = 0; j < P - 1; j++) for (let i = 0; i < P - 1; i++) {
    const o = j * P + i, a = zone[o], b = zone[o + 1], d = zone[o + P];
    if (a === b && a === d) continue;
    const safeEdge = Math.max(a, b, d) === 2;
    if (!safeEdge && ((i + j) >> 2) % 3 === 2) continue; // the air limit is dashed
    const c3 = safeEdge ? [8, 132, 8] : [36, 104, 200];
    paint(o, c3); paint(o + 1, c3); paint(o + P, c3);
  }
  ctx.putImageData(img, 0, 0);
}
const mark = (v, x, y) => v === 'go' ? `<circle cx="${x}" cy="${y}" r="6.5" fill="var(--go)" stroke="var(--sheet)" stroke-width="2"/>`
  : v === 'risk' ? `<path d="M${x} ${y - 8.5} L${x + 8.5} ${y + 6.5} L${x - 8.5} ${y + 6.5} Z" fill="var(--caution)" stroke="var(--sheet)" stroke-width="2" stroke-linejoin="round"/>`
  : `<path d="M${x - 6} ${y - 6} L${x + 6} ${y + 6} M${x + 6} ${y - 6} L${x - 6} ${y + 6}" stroke="var(--sheet)" stroke-width="7" stroke-linecap="round"/><path d="M${x - 6} ${y - 6} L${x + 6} ${y + 6} M${x + 6} ${y - 6} L${x - 6} ${y + 6}" stroke="var(--nogo)" stroke-width="3.6" stroke-linecap="round"/>`;
function renderWalk() {
  const s = site(), c = cond(), R = M.radii(c);
  $('#walkSub').textContent = t(s.kind === 'ground' ? 'walk_sub_ground' : 'walk_sub_orbital');
  const evals = s.targets.map(tg => ({ tg, e: M.evalTarget(s, tg, c) }));
  if (!s.targets.some(tg => tg.id === S.target)) S.target = s.focus;

  /* map */
  const F = M.field(s, c);
  drawWalkRaster(s, c, F);
  const kx = x => WP / 2 + x / F.W * WP / 2, ky = y => WP / 2 - y / F.W * WP / 2;
  const B = [kx(F.bx), ky(F.by)];
  const pos = e => {
    let X = kx(e.x), Y = ky(e.y), far = false;
    if (!e.inside || X < 14 || X > WP - 14 || Y < 14 || Y > WP - 14) {
      const dx = X - B[0], dy = Y - B[1]; let k = 1;
      if (dx > 0) k = Math.min(k, (WP - 18 - B[0]) / dx); if (dx < 0) k = Math.min(k, (18 - B[0]) / dx);
      if (dy > 0) k = Math.min(k, (WP - 18 - B[1]) / dy); if (dy < 0) k = Math.min(k, (18 - B[1]) / dy);
      X = B[0] + dx * k; Y = B[1] + dy * k; far = true;
    }
    if (Math.hypot(X - B[0], Y - B[1]) < 24) { const a = e.brg * M.DEG; X = B[0] + 26 * Math.sin(a); Y = B[1] - 26 * Math.cos(a); }
    return [X, Y, far];
  };
  let g = '';
  const smallScreen = window.matchMedia && window.matchMedia('(max-width:600px)').matches;
  const nice = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5].filter(v => v <= F.W * 0.5).pop(), sbw = nice / F.W * WP / 2;
  g += `<g class="w-scale"><rect x="10" y="${WP - 44}" width="${(sbw + 20).toFixed(1)}" height="34" rx="3"/><path d="M20 ${WP - 24} v6 h${sbw.toFixed(1)} v-6"/><text x="${(20 + sbw / 2).toFixed(1)}" y="${WP - 28}" text-anchor="middle">${fmtD(nice)}</text></g>`;
  g += `<g class="w-north" transform="translate(${WP - 26},32)"><path d="M0 -16 L7 6 L0 1 L-7 6 Z"/><text y="21" text-anchor="middle">N</text></g>`;
  if (S.offset) {
    const gx = kx(0), gy = ky(0);
    g += `<line class="w-path" x1="${B[0].toFixed(1)}" y1="${B[1].toFixed(1)}" x2="${gx}" y2="${gy}" style="stroke:var(--ink-2)"/>`;
    g += `<path class="w-ghost" d="M${gx - 7} ${gy} H${gx + 7} M${gx} ${gy - 7} V${gy + 7}"/><circle class="w-ghost" cx="${gx}" cy="${gy}" r="9"/>`;
    g += `<text class="w-t small" x="${gx}" y="${gy + 24}" text-anchor="middle">${t('w_planned')}</text>`;
  }
  const sel = evals.find(x => x.tg.id === S.target);
  if (sel) {
    const [x, y] = pos(sel.e);
    if (sel.e.routed) {
      const d = smoothPath(M.pathTo(F, sel.e.cell)).map((p, i) => (i ? 'L' : 'M') + kx(p[0]).toFixed(1) + ' ' + ky(p[1]).toFixed(1)).join(' ');
      g += `<path class="w-route-case" d="${d}"/><path class="w-route" d="${d}"/>`;
    } else g += `<line class="w-path" x1="${B[0].toFixed(1)}" y1="${B[1].toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
  }
  g += `<rect class="w-base" x="${(B[0] - 6.5).toFixed(1)}" y="${(B[1] - 6.5).toFixed(1)}" width="13" height="13"/>`;
  g += `<text class="w-t" x="${(B[0] + (B[0] > WP - 70 ? -12 : 12)).toFixed(1)}" y="${(B[1] + 18).toFixed(1)}" text-anchor="${B[0] > WP - 70 ? 'end' : 'start'}">${t('w_base')}</text>`;
  for (const { tg, e } of evals) {
    const [x, y, far] = pos(e), isSel = tg.id === S.target;
    const name = L(SHORT[tg.id] || tg.name) + (far || isSel ? ' · ' + fmtD(e.d) : '');
    const est = name.length * 7.1 * (smallScreen ? 1.55 : 1) + 14;
    let anchor = x >= B[0] ? 'start' : 'end';
    if (anchor === 'start' && x + est > WP - 4) anchor = 'end';
    if (anchor === 'end' && x - est < 4) anchor = 'start';
    const tx = anchor === 'start' ? x + 12 : x - 12;
    g += `<g class="w-tg${isSel ? ' sel' : ''}" data-id="${tg.id}" tabindex="0" role="button" aria-label="${esc(L(tg.name) + ', ' + fmtD(e.d) + ', ' + t('v_' + e.verdict))}">` +
      `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="18" fill="transparent"/><circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13"/>` +
      mark(e.verdict, +x.toFixed(1), +y.toFixed(1)) +
      `<text class="w-t" x="${tx.toFixed(1)}" y="${(y + 4.5).toFixed(1)}" text-anchor="${anchor}">${esc(name)}</text></g>`;
  }
  const wm = $('#walkmap'); wm.innerHTML = g; wm.setAttribute('aria-label', L(s.name));
  $$('#wlSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.wl === S.wlayer)));
  const E0 = M.EVA;
  $('#terrKey').innerHTML = S.wlayer === 'time'
    ? `<span class="legend-bar"><i style="background:linear-gradient(90deg,rgb(46,150,72),rgb(244,204,72) 31%,rgb(216,84,60) 62%,rgb(112,58,58))"></i>${t('tk_time', { lim: hm(M.limitH(c)) })}</span>`
    : M.CLASSES.map(k => `<span><i style="background:rgb(${TCOL[k].join(',')})"></i>${t('terr_' + k)}${k === 'cliff' ? ': ' + t('tk_no') : ' ×' + nf(E0.terrain[k], E0.terrain[k] === 1 ? 0 : 2)}</span>`).join('');
  $('#walkKey').innerHTML = `<span><i></i>${t(S.flare ? 'key_safe_flare' : 'key_safe', { km: nf(R.safe, 1), lim: hm(M.limitH(c)) })}</span><span><i class="plan"></i>${t('key_plan', { km: nf(R.plan, 1) })}</span><span class="small">${t('key_note')}</span>`;
  $('#wmapNote').textContent = t('wmap_note');

  /* what the switches mean */
  const pre = [];
  if (S.storm) pre.push(['amber', 'pre_storm']);
  if (S.flare) pre.push(['violet', 'pre_flare']);
  if (S.reactor) pre.push(['red', 'pre_reactor']);
  if (S.offset) pre.push(['blue', 'pre_offset']);
  $('#precedents').innerHTML = pre.length
    ? pre.map(([cls, k]) => `<article class="${cls}"><h3>${t(k + '_t')}</h3><p>${t(k, { min: Math.round(M.EVA.flareWarnH * 60) })}</p></article>`).join('')
    : `<article><p>${t('pre_none')}</p></article>`;

  /* targets */
  const chip = v => `<span class="vd ${v}"><i></i>${t('v_' + v)}</span>`;
  $('#targets').innerHTML = evals.map(({ tg, e }) =>
    `<button type="button" class="tg" data-id="${tg.id}" aria-pressed="${tg.id === S.target}"><b>${esc(L(tg.name))}${s.kind === 'orbital' ? `<span class="tag">${t('hypo')}</span>` : ''}</b>` +
    `<small>${fmtD(e.d)} · ${t('terr_' + tg.terrain)}</small>${chip(e.verdict)}</button>`).join('');

  /* detail */
  if (!sel) { $('#detail').innerHTML = ''; return; }
  const { tg, e } = sel, E = M.EVA;
  const scale = Math.max(10, Math.ceil(e.total + 0.5)), pc = v => (100 * Math.min(v, scale) / scale).toFixed(2) + '%';
  const seg = (cls, a, w, label) => w / scale > 0.004 ? `<div class="tl-seg ${cls}" style="left:${pc(a)};width:${pc(w)}">${w / scale > 0.11 ? label : ''}</div>` : '';
  const tl = `<div class="tl"><div class="tl-track"></div>` +
    seg('out', 0, e.tOut, t('tl_out')) + seg('work', e.tOut, e.work, t('tl_work')) + seg('back' + (S.storm ? ' storm' : ''), e.tOut + e.work, Math.min(e.tBack, scale - e.tOut - e.work), t('tl_back')) +
    `<div class="tl-tick${E.suitH / scale > 0.6 ? ' far' : ''}" style="left:${pc(E.suitH)}"><span class="up">${E.suitH} ${t('u_h')}: ${t('tl_air')}</span></div>` +
    `<div class="tl-tick res${(E.suitH + E.reserveH) / scale > 0.6 ? ' far' : ''}" style="left:${pc(E.suitH + E.reserveH)}"><span class="dn">${E.suitH + E.reserveH} ${t('u_h')}: ${t('tl_res')}</span></div></div>`;
  const win = e.window;
  const winTxt = win.hours > 0 ? t('d_window_v', { a: clock(win.open), b: clock(win.close), h: hm(win.hours) }) : t('d_window_none');
  const flareBinds = S.flare && e.tSafe <= E.reserveH;
  let vl = e.verdict === 'go' ? t('vl_go') : e.verdict === 'risk' ? t(flareBinds ? 'vl_risk_flare' : 'vl_risk', { min: Math.round(E.flareWarnH * 60) }) : !e.airOK ? t('vl_nogo_air') : t('vl_nogo_light');
  if (e.verdict !== 'go') {
    if (S.storm) vl += ' ' + t('why_storm');
    if (!e.roverAvail) vl += ' ' + t(S.reactor ? 'why_reactor' : 'why_terrain');
  }
  $('#detail').innerHTML =
    `<h3>${esc(L(tg.name))} ${chip(e.verdict)}</h3>${tl}` +
    `<dl class="kv"><dt>${t('d_dist')}</dt><dd>${t(e.routed ? 'd_dist_v' : 'd_dist_line', { d: fmtD(e.d), p: fmtD(e.pathKm), terr: t('terr_' + tg.terrain), v: nf(e.v, 1) })}</dd>` +
    `<dt>${t('d_time')}</dt><dd>${t('d_time_v', { t: hm(e.total), max: E.suitH })}</dd>` +
    `<dt>${t('d_window')}</dt><dd>${winTxt}</dd>` +
    `<dt>${t(S.flare ? 'd_fail_flare' : 'd_fail')}</dt><dd>${t(S.flare ? 'd_fail_v_flare' : 'd_fail_v', { t: hm(e.tSafe), how: t(e.how === 'rover' ? 'how_rover' : 'how_walk'), res: hm(e.limit) })}</dd></dl>` +
    `<p class="verdict-line">${vl}</p>` +
    `<div class="science"><h3>${t('sci_h')}</h3><p>${esc(L(tg.note))}</p></div>`;
}

/* ================= 3. ONE SOL ================= */
const CH = { x0: 58, x1: 986, sky: [28, 88], temp: [126, 212], pow: [252, 338], sto: [378, 420], crew: [456, 482] };
const cxh = h => CH.x0 + h / 24 * (CH.x1 - CH.x0);
const yIn = (band, v, lo, hi) => band[1] - (v - lo) / (hi - lo) * (band[1] - band[0]);
const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
const rgb = c => `rgb(${c.map(v => Math.round(v)).join(',')})`;
const skyColor = (el, tau) => {
  const night = [16, 19, 28], dusk = [86, 122, 166], day = [219, 182, 141], murk = [58, 41, 29];
  let c = el < -12 ? night : el < 0 ? mix(night, dusk, (el + 12) / 12) : el < 12 ? mix(dusk, day, el / 12) : day;
  const k = Math.max(0, Math.min(1, (tau - 0.5) / 8));
  return k > 0 ? mix(c, el > -6 ? murk : night, k * 0.93) : c;
};
let SOL = null;
function renderSol() {
  const s = site(), c = cond(), tau = M.tauOf(c);
  $('#solSub').textContent = t('sol_sub', { site: L(s.name), ls: S.ls });
  const sim = M.simulate(s, c, 30), step = 0.25, n = 97;
  const hrs = Array.from({ length: n }, (_, i) => i * step);
  const el = hrs.map(h => M.sunElev(s.lat, S.ls, h % 24));
  const temp = hrs.map(h => M.tempAt(s, S.ls, h % 24, tau));
  const pw = hrs.map(h => M.powerAt(s, c, h % 24));
  const sto = hrs.map((h, i) => 100 * sim.series[Math.min(i, sim.series.length - 1)].store / sim.cap);
  SOL = { hrs, el, temp, pw, sto, sim, tau };

  let g = '';
  const title = (band, key, extra) => `<text class="c-title" x="${CH.x0}" y="${band[0] - 9}">${t(key)}</text>${extra || ''}`;
  const yAxis = (band, lo, hi, ticks) => ticks.map(v => `<line class="c-grid" x1="${CH.x0}" x2="${CH.x1}" y1="${yIn(band, v, lo, hi)}" y2="${yIn(band, v, lo, hi)}"/><text class="c-axis" x="${CH.x0 - 7}" y="${yIn(band, v, lo, hi) + 3.5}" text-anchor="end">${nf(v)}</text>`).join('');
  const line = (band, arr, lo, hi) => arr.map((v, i) => (i ? 'L' : 'M') + cxh(hrs[i]).toFixed(1) + ' ' + yIn(band, Math.max(lo, Math.min(hi, v)), lo, hi).toFixed(1)).join(' ');

  /* sky */
  g += title(CH.sky, 'row_sky');
  g += `<defs><linearGradient id="skyg" x1="0" x2="1" y1="0" y2="0">${hrs.map((h, i) => `<stop offset="${(h / 24).toFixed(4)}" stop-color="${rgb(skyColor(el[i], tau))}"/>`).join('')}</linearGradient></defs>`;
  g += `<rect x="${CH.x0}" y="${CH.sky[0]}" width="${CH.x1 - CH.x0}" height="${CH.sky[1] - CH.sky[0]}" fill="url(#skyg)"/>`;
  let sun = ''; let pen = false;
  el.forEach((v, i) => { if (v > 0) { sun += (pen ? 'L' : 'M') + cxh(hrs[i]).toFixed(1) + ' ' + (CH.sky[1] - 3 - v / 90 * (CH.sky[1] - CH.sky[0] - 10)).toFixed(1) + ' '; pen = true; } else pen = false; });
  if (sun) g += `<path d="${sun}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  const noon = Math.max(...el);
  if (noon > 0) g += `<text class="c-axis" x="${cxh(12) + 12}" y="${Math.max(CH.sky[0] + 13, CH.sky[1] - 3 - noon / 90 * (CH.sky[1] - CH.sky[0] - 10) - 6).toFixed(1)}" style="fill:#fff">${nf(noon)}°</text>`;

  /* temperature */
  g += title(CH.temp, 'row_temp') + yAxis(CH.temp, -130, 10, [-120, -80, -40, 0]);
  g += `<path class="c-line" d="${line(CH.temp, temp, -130, 10)}" stroke="var(--ink)"/>`;

  /* power */
  const lx = CH.x0 + (LANG === 'ru' ? 150 : 128);
  g += title(CH.pow, 'row_power',
    `<line x1="${lx}" x2="${lx + 18}" y1="${CH.pow[0] - 13}" y2="${CH.pow[0] - 13}" stroke="var(--plan)" stroke-width="2"/><text class="c-lab" x="${lx + 24}" y="${CH.pow[0] - 9}">${t('lg_gen')}</text>` +
    `<line x1="${lx + 110}" x2="${lx + 128}" y1="${CH.pow[0] - 13}" y2="${CH.pow[0] - 13}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 3"/><text class="c-lab" x="${lx + 134}" y="${CH.pow[0] - 9}">${t('lg_load')}</text>`);
  g += yAxis(CH.pow, 0, 100, [0, 25, 50, 75, 100]);
  const gen = pw.map(p => p.gen);
  g += `<path d="${line(CH.pow, gen, 0, 100)} L${CH.x1} ${CH.pow[1]} L${CH.x0} ${CH.pow[1]} Z" fill="var(--plan)" opacity=".1"/>`;
  g += `<path class="c-line" d="${line(CH.pow, gen, 0, 100)}" stroke="var(--plan)"/>`;
  g += `<path class="c-line" d="${line(CH.pow, pw.map(p => p.load), 0, 100)}" stroke="var(--ink)" stroke-dasharray="5 3"/>`;

  /* storage */
  g += title(CH.sto, 'row_store') + yAxis(CH.sto, 0, 100, [0, 100]);
  g += `<path d="${line(CH.sto, sto, 0, 100)} L${CH.x1} ${CH.sto[1]} L${CH.x0} ${CH.sto[1]} Z" fill="var(--ink-2)" opacity=".1"/>`;
  g += `<path class="c-line" d="${line(CH.sto, sto, 0, 100)}" stroke="var(--ink-2)"/>`;

  /* crew */
  g += title(CH.crew, 'row_crew');
  const win = M.walkWindow(s.lat, S.ls);
  const hasEva = !S.storm && !S.flare && !S.reactor && win.hours >= 2 && !win.st.polarNight;
  let blocks;
  if (S.reactor) blocks = [[0, 24, 'crew_emerg', '#F4C4BE', '#141A22']];
  else {
    blocks = [[0, 6.5, 'crew_sleep', '#2B3440', '#E6EAE4']];
    if (hasEva) {
      const open = Math.max(6.5, win.open), close = Math.min(19, win.close);
      if (open > 6.5) blocks.push([6.5, open, 'crew_prep', '#CDD2CA', '#141A22']);
      blocks.push([open, close, 'crew_eva', '#2A78D6', '#FFFFFF']);
      if (close < 19) blocks.push([close, 19, 'crew_lab', '#DDE0D8', '#141A22']);
    } else blocks.push([6.5, 19, S.flare && !S.storm ? 'crew_flare' : 'crew_shelter', S.flare && !S.storm ? '#DCCBFA' : '#DDE0D8', '#141A22']);
    blocks.push([19, 20.5, 'crew_comm', '#AEBCCB', '#141A22'], [20.5, 22.5, 'crew_rest', '#DDE0D8', '#141A22'], [22.5, 24, 'crew_sleep', '#2B3440', '#E6EAE4']);
  }
  for (const [a, b, key, fill, ink] of blocks) {
    const x = cxh(a), w = cxh(b) - cxh(a), label = t(key);
    g += `<rect x="${(x + 1).toFixed(1)}" y="${CH.crew[0]}" width="${Math.max(0, w - 2).toFixed(1)}" height="${CH.crew[1] - CH.crew[0]}" rx="2" fill="${fill}"/>`;
    if (w > label.length * 6.1 + 8) g += `<text class="crew-t" x="${(x + w / 2).toFixed(1)}" y="${CH.crew[0] + 17}" text-anchor="middle" fill="${ink}">${label}</text>`;
  }
  for (let h = 0; h <= 24; h += 3) g += `<line class="c-base" x1="${cxh(h)}" x2="${cxh(h)}" y1="${CH.crew[1] + 3}" y2="${CH.crew[1] + 8}"/><text class="c-axis" x="${cxh(h)}" y="${CH.crew[1] + 21}" text-anchor="middle">${h === 24 ? '24:00' : clock(h)}</text>`;

  /* playhead */
  g += `<g id="ph"><line class="c-play" id="phLine" y1="${CH.sky[0] - 4}" y2="${CH.crew[1] + 3}"/>` +
    `<circle id="phSun" r="6" fill="#FFF1CF" stroke="#141A22" stroke-width="1.2"/>` +
    `<circle class="c-dot" id="phTemp" r="5" fill="var(--ink)"/><circle class="c-dot" id="phGen" r="5" fill="var(--plan)"/><circle class="c-dot" id="phSto" r="5" fill="var(--ink-2)"/></g>`;
  const svg = $('#solchart'); svg.innerHTML = g; svg.setAttribute('aria-label', t('s3') + ': ' + L(s.name));
  renderProjection();
  updatePlayhead();
}
const at = (arr, h) => { const x = Math.max(0, Math.min(96, h / 0.25)), i = Math.floor(x), k = x - i; return i >= 96 ? arr[96] : arr[i] + (arr[i + 1] - arr[i]) * k; };
function logText(h) {
  const s = site(), tau = SOL.tau, T = Math.round(at(SOL.temp, h)), tt = nf(T), win = M.walkWindow(s.lat, S.ls), st = win.st;
  if (S.reactor) return t('log_reactor', { s: nf(at(SOL.sto, h)) });
  if (st.polarNight) return t('log_polar', { t: tt });
  const light = h > st.rise && h < st.set;
  if (S.flare && !S.storm && h >= 6.5 && h < 19) return t('log_flare');
  if (S.storm) return light ? t('log_storm', { pct: nf(100 * M.trans(tau) / M.trans(M.MARS.tauClear)) }) : t('log_storm_night', { t: tt });
  if (h < st.rise - 0.4 || h >= 22.5) return T < -89.2 ? t('log_night_cold', { t: tt }) : t('log_night', { t: tt });
  const hasEva = win.hours >= 2;
  if (h < Math.max(st.rise + 0.8, hasEva ? win.open : 0)) return t('log_rise', { t: tt });
  if (hasEva && h < win.close - 0.5) return t('log_eva', { b: clock(win.close), t: tt });
  if (hasEva && h < st.set - 0.4) return t('log_close');
  if (!hasEva && h < st.set - 0.4) return t('log_day_noeva', { t: tt });
  if (h < st.set + 0.7) return t('log_set');
  if (h < 20) return t('log_comm');
  return t('log_evening', { t: tt });
}
function updatePlayhead() {
  if (!SOL) return;
  const h = S.hour, x = cxh(h).toFixed(1), el = at(SOL.el, h), T = at(SOL.temp, h), i = Math.min(96, Math.round(h / 0.25));
  const gen = at(SOL.pw.map(p => p.gen), h), load = SOL.pw[i].load, sto = at(SOL.sto, h);
  const ln = $('#phLine'); if (!ln) return;
  ln.setAttribute('x1', x); ln.setAttribute('x2', x);
  const sun = $('#phSun');
  sun.setAttribute('cx', x); sun.setAttribute('cy', (CH.sky[1] - 3 - Math.max(0, el) / 90 * (CH.sky[1] - CH.sky[0] - 10)).toFixed(1));
  sun.style.display = el > 0 ? '' : 'none'; sun.setAttribute('opacity', S.storm ? 0.45 : 1);
  $('#phTemp').setAttribute('cx', x); $('#phTemp').setAttribute('cy', yIn(CH.temp, T, -130, 10).toFixed(1));
  $('#phGen').setAttribute('cx', x); $('#phGen').setAttribute('cy', yIn(CH.pow, Math.min(100, gen), 0, 100).toFixed(1));
  $('#phSto').setAttribute('cx', x); $('#phSto').setAttribute('cy', yIn(CH.sto, sto, 0, 100).toFixed(1));
  $('#readout').innerHTML =
    `<span>${t('r_time')} <b>${h >= 24 ? '24:00' : clock(h)}</b></span>` +
    `<span>${t('r_sun')} <b>${el > 0 ? nf(el) + '°' : t('sun_below')}</b></span>` +
    `<span>${t('r_temp')} <b>${nf(Math.round(T))} °C</b></span>` +
    `<span>${t('r_gen')} <b>${nf(gen, 1)} ${t('u_kw')}</b></span>` +
    `<span>${t('r_load')} <b>${nf(load)} ${t('u_kw')}</b></span>` +
    `<span>${t('r_store')} <b>${nf(sto)} %</b></span>`;
  $('#logline').textContent = logText(h);
  const sc = $('#scrub'); if (document.activeElement !== sc) sc.value = h;
  $('#play').textContent = t(S.playing ? 'pause' : 'play');
}
function renderProjection() {
  const sim = SOL.sim, X0 = 46, X1 = 624, Y0 = 12, Y1 = 136;
  const x = d => X0 + d / 30 * (X1 - X0), y = v => Y1 - v / 100 * (Y1 - Y0);
  let g = '';
  for (const v of [0, 50, 100]) g += `<line class="c-grid" x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}"/><text class="c-axis" x="${X0 - 7}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  for (let d = 0; d <= 30; d += 5) g += `<line class="c-base" x1="${x(d)}" x2="${x(d)}" y1="${Y1}" y2="${Y1 + 5}"/><text class="c-axis" x="${x(d)}" y="${Y1 + 18}" text-anchor="middle">${d}</text>`;
  g += `<text class="c-axis" x="${X1}" y="${Y1 + 36}" text-anchor="end">${t(S.reactor ? 'proj_axis' : 'proj_axis_ok')}</text>`;
  const pts = sim.series.filter((_, i) => i % 2 === 0).map(p => [x(p.sol - 1 + p.h / 24), y(100 * p.store / sim.cap)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  g += `<path d="${d} L${X1} ${Y1} L${X0} ${Y1} Z" fill="var(--ink-2)" opacity=".1"/><path class="c-line" d="${d}" stroke="var(--ink-2)"/>`;
  const storm = S.storm ? M.STORMS[S.stormClass] : null;
  if (storm && storm.sols < 30) g += `<line class="c-base" x1="${x(storm.sols)}" x2="${x(storm.sols)}" y1="${Y0}" y2="${Y1}" style="stroke:var(--ink-3)"/><text class="c-axis" x="${x(storm.sols) + 5}" y="${Y0 + 10}">${t('proj_storm_end')}</text>`;
  let txt;
  if (!S.reactor) txt = t(S.storm ? 'proj_ok_reactor_storm' : 'proj_ok_reactor');
  else if (sim.blackout) {
    const bx = x(sim.blackout.sol - 1 + sim.blackout.h / 24);
    g += `<circle cx="${bx.toFixed(1)}" cy="${y(0)}" r="6" fill="var(--nogo)" stroke="var(--sheet)" stroke-width="2"/>` +
      `<text class="c-title" x="${(bx + 10).toFixed(1)}" y="${y(0) - 9}">${t('proj_blackout')}</text>`;
    txt = t('proj_dead', { sol: sim.blackout.sol, time: clock(sim.blackout.h) });
  } else txt = t('proj_ok', { min: nf(100 * sim.min / sim.cap) });
  const svg = $('#projchart'); svg.innerHTML = g; svg.setAttribute('aria-label', t('proj_title'));
  $('#projText').textContent = txt;
}
let lastTs = 0;
function tick(ts) {
  if (!S.playing) return;
  if (!lastTs) lastTs = ts;
  S.hour += (ts - lastTs) / 1000 * 24 / 22; lastTs = ts;
  if (S.hour >= 24) { S.hour = 24; S.playing = false; }
  updatePlayhead();
  if (S.playing) requestAnimationFrame(tick);
}

/* ================= 4. CROWD ================= */
let resetArmed = false;
function renderCrowd() {
  const box = $('#crowdBody');
  if (!S.revealed) { box.innerHTML = `<div class="panel locked"><p>${t('crowd_locked')}</p><a class="btn" href="#choose">${t('to_map')}</a></div>`; return; }
  const total = Object.values(votes).reduce((a, b) => a + b, 0), maxV = Math.max(1, ...Object.values(votes));
  let sum;
  if (!total) sum = t('crowd_none');
  else {
    const top = [...RANK].sort((a, b) => (votes[b.site.id] || 0) - (votes[a.site.id] || 0))[0];
    const v = { site: L(top.site.name), votes: votes[top.site.id], total, rank: top.rankWorst, n: SITES.length };
    sum = top.rankWorst === 1 ? t('crowd_agree', v) : t('crowd_sum', v);
  }
  const rows = RANK.map(r => {
    const d = r.rankNaive - r.rankWorst, v = votes[r.site.id] || 0;
    const delta = d > 0 ? `▲ ${d}` : d < 0 ? `▼ ${-d}` : '';
    return `<tr class="rowbtn${r.site.id === S.site ? ' cur' : ''}" data-id="${r.site.id}" tabindex="0">` +
      `<td class="n">${r.rankWorst}</td>` +
      `<td class="site"><b>${esc(L(r.site.name))}</b>${r.site.id === S.voted ? `<span class="tag">${t('mine')}</span>` : ''}${r.site.kind === 'orbital' ? `<small>${t('no_ground')}</small>` : ''}</td>` +
      `<td><div class="hbar"><div class="track"><div class="fill" style="width:${r.worst.toFixed(0)}%"></div></div><span>${nf(r.worst)}</span></div></td>` +
      `<td class="delta">${nf(r.naive)} · #${r.rankNaive} ${delta}</td>` +
      `<td>${t('weak_' + r.weak)}</td>` +
      `<td><div class="hbar"><div class="track"><div class="fill votes" style="width:${(100 * v / maxV).toFixed(0)}%;${v ? '' : 'min-width:0'}"></div></div><span>${v}</span></div></td></tr>`;
  }).join('');
  box.innerHTML = `<p class="crowd-sum">${esc(sum)}</p><div class="panel" style="padding:8px 12px"><div class="table-scroll"><table class="rank">` +
    `<thead><tr><th>#</th><th>${t('col_site')}</th><th>${t('col_worst')}</th><th>${t('col_naive')}</th><th>${t('col_weak')}</th><th>${t('col_votes')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>` +
    `<p class="small muted" style="max-width:86ch;margin:12px 0 0">${t('naive_expl')}</p>` +
    `<div class="crowd-actions"><button type="button" class="btn" id="nextVote">${t('btn_next_vote')}</button>` +
    `<button type="button" class="btn ghost" id="resetVotes">${t(resetArmed ? 'btn_reset_sure' : 'btn_reset')}</button><span class="small muted">${t('votes_note')}</span></div>`;
}

/* ================= 5. METHOD ================= */
function renderMethod() {
  const B = M.BASE, E = M.EVA;
  const items = [
    t('a1', { crew: B.crew, r: B.reactorKW, ln: B.loadNominal, ls: B.loadSurvival }),
    t('a2', { a: B.backupArea, eff: nf(B.eff * 100), st: B.storeKWh }),
    t('a3', { n: B.repairSols }),
    t('a4', { s: E.suitH, r: E.reserveH, w: nf(E.workH, 1) }),
    t('a5', { p: nf(E.pace, 1) }),
    t('a6', { v: E.roverKmh, d: Math.round(E.dispatchH * 60) }),
    t('a7'), t('a8', { a: E.startAfterRise, b: E.endBeforeSet }),
    t('a11', { min: Math.round(E.flareWarnH * 60) }), t('a12', { n: M.field(SITES[0], {}).N }), t('a9'), t('a10')
  ];
  $('#assume').innerHTML = items.map(x => `<li>${x}</li>`).join('');
  $('#sources').innerHTML = SOURCES.map(([u, l]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(L(l))}</a></li>`).join('');
}

/* ================= glue ================= */
function applyStatic() {
  document.documentElement.lang = LANG;
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#langRu').setAttribute('aria-pressed', String(LANG === 'ru'));
  $('#langEn').setAttribute('aria-pressed', String(LANG === 'en'));
  $$('#layerSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.layer === S.layer)));
}
function renderConditions() { renderConsole(); drawOverlay(); renderMapSvg(); renderMapFoot(); renderSite(); renderWalk(); renderSol(); }
function renderAll() { applyStatic(); renderChoose(); renderConditions(); renderCrowd(); renderMethod(); }

const onKeyActivate = fn => e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); } };
function wire() {
  $('#langRu').addEventListener('click', () => { LANG = 'ru'; mem.set('ws.lang', LANG); renderAll(); });
  $('#langEn').addEventListener('click', () => { LANG = 'en'; mem.set('ws.lang', LANG); renderAll(); });
  $('#layerSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.layer = b.dataset.layer; applyStatic(); drawOverlay(); renderMapSvg(); renderMapFoot(); });
  $('#baseSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setBase(b.dataset.base); });
  const mapPick = e => { const g = e.target.closest('.mk'); if (g) pick(g.dataset.id, true); };
  $('#mapsvg').addEventListener('click', mapPick);
  $('#mapsvg').addEventListener('keydown', onKeyActivate(mapPick));
  $('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) pick(b.dataset.id, true); });
  $('#voteRow').addEventListener('click', e => { if (e.target.id === 'skipVote') { S.revealed = true; renderAll(); } });
  $('#siteSelect').addEventListener('change', e => pick(e.target.value, false));
  $('#lampStorm').addEventListener('click', () => { S.storm = !S.storm; renderConditions(); });
  $('#lampReactor').addEventListener('click', () => { S.reactor = !S.reactor; renderConditions(); });
  $('#lampFlare').addEventListener('click', () => { S.flare = !S.flare; renderConditions(); });
  $('#wlSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.wlayer = b.dataset.wl; renderWalk(); });
  $('#lampOffset').addEventListener('click', () => { S.offset = !S.offset; renderConditions(); });
  $('#stormClass').addEventListener('change', e => { S.stormClass = e.target.value; S.storm = true; renderConditions(); });
  $('#offsetKm').addEventListener('input', e => { S.offsetKm = +e.target.value; S.offset = true; renderConditions(); });
  $('#offsetDir').addEventListener('click', () => { S.offsetBrg = (S.offsetBrg + 67) % 360; S.offset = true; renderConditions(); });
  $('#ls').addEventListener('input', e => { S.ls = +e.target.value; renderConditions(); });
  $('#worstSeason').addEventListener('click', () => { S.ls = M.extremeLs(site().lat).worst; renderConditions(); });
  const tgPick = e => { const g = e.target.closest('[data-id]'); if (g) { S.target = g.dataset.id; renderWalk(); } };
  $('#walkmap').addEventListener('click', tgPick);
  $('#walkmap').addEventListener('keydown', onKeyActivate(tgPick));
  $('#targets').addEventListener('click', tgPick);
  $('#play').addEventListener('click', () => {
    S.playing = !S.playing;
    if (S.playing) { if (S.hour >= 24) S.hour = 0; lastTs = 0; requestAnimationFrame(tick); }
    updatePlayhead();
  });
  $('#scrub').addEventListener('input', e => { S.playing = false; S.hour = +e.target.value; updatePlayhead(); });
  const crowd = $('#crowdBody');
  crowd.addEventListener('click', e => {
    if (e.target.id === 'nextVote') { S.voted = null; S.revealed = false; resetArmed = false; renderAll(); $('#choose').scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }); return; }
    if (e.target.id === 'resetVotes') {
      if (resetArmed) { votes = {}; mem.set('ws.votes', votes); S.voted = null; resetArmed = false; renderChoose(); renderMapSvg(); } else resetArmed = true;
      renderCrowd(); return;
    }
    const tr = e.target.closest('tr.rowbtn'); if (tr) { pick(tr.dataset.id, false); $('#site').scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }); }
  });
  crowd.addEventListener('keydown', onKeyActivate(e => { const tr = e.target.closest('tr.rowbtn'); if (tr) { pick(tr.dataset.id, false); $('#site').scrollIntoView(); } }));
}

wire();
renderAll();
requestAnimationFrame(() => { buildRelief(); probeTiles(); });
})();
</script>
